<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Audio Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #drop-zone.active {
            opacity: 1;
            pointer-events: all;
            background: rgba(10, 10, 10, 0.95);
        }

        .drop-message {
            color: #a855f7;
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            padding: 3rem;
            border: 3px dashed #a855f7;
            border-radius: 16px;
        }

        #controls {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
            z-index: 100;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: none;
        }

        .btn:hover {
            border-color: #a855f7;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
        }

        .btn.active {
            display: block;
        }

        #instructions {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            font-size: 1.25rem;
            max-width: 500px;
            z-index: 50;
        }

        #instructions.hidden {
            display: none;
        }

        .highlight {
            color: #a855f7;
            font-weight: 600;
        }

        #back-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: #666;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease;
            z-index: 100;
        }

        #back-link:hover {
            color: #a855f7;
        }
    </style>
</head>
<body>
    <a href="../../" id="back-link">← Back to Index</a>

    <div id="drop-zone">
        <div class="drop-message">
            Drop audio file here
        </div>
    </div>

    <div id="instructions">
        <p><span class="highlight">Drag and drop</span> an audio file anywhere on the page to begin</p>
    </div>

    <div id="controls">
        <button id="play-btn" class="btn">Play</button>
        <button id="pause-btn" class="btn">Pause</button>
    </div>

    <script>
        let song;
        let fft;
        let amplitude;
        let isPlaying = false;
        let audioLoaded = false;

        // Circle properties
        const MAX_DIAMETER = 667;
        const CIRCLE_LAYERS = [
            { name: 'bass', color: '#a855f7', range: [0, 85], baseRadius: 150 },      // Bass: purple
            { name: 'mid', color: '#3b82f6', range: [85, 170], baseRadius: 200 },     // Mid: blue
            { name: 'treble', color: '#ec4899', range: [170, 255], baseRadius: 250 }  // Treble: pink
        ];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            fft = new p5.FFT(0.8, 256);
            amplitude = new p5.Amplitude();

            // Set up drag and drop
            setupDragAndDrop();
        }

        function draw() {
            background(10, 10, 10);

            if (audioLoaded && song) {
                // Analyze audio
                let spectrum = fft.analyze();

                // Draw each frequency band as a wavy circle
                push();
                translate(width / 2, height / 2);

                CIRCLE_LAYERS.forEach(layer => {
                    drawWavyCircle(layer, spectrum);
                });

                pop();
            }
        }

        function drawWavyCircle(layer, spectrum) {
            // Extract frequency range for this layer
            let sum = 0;
            for (let i = layer.range[0]; i < layer.range[1]; i++) {
                sum += spectrum[i];
            }
            let avg = sum / (layer.range[1] - layer.range[0]);

            // Map average to distortion amount
            let distortion = map(avg, 0, 255, 0, 50);

            // Draw the circle with displacement
            noFill();
            stroke(layer.color);
            strokeWeight(3);

            beginShape();
            let points = 100; // Number of points around the circle
            for (let i = 0; i <= points; i++) {
                let angle = map(i, 0, points, 0, TWO_PI);

                // Get frequency data for this angle
                let index = floor(map(i, 0, points, layer.range[0], layer.range[1]));
                let freqValue = spectrum[index] || 0;

                // Calculate displacement based on frequency
                let displacement = map(freqValue, 0, 255, -distortion, distortion);

                // Calculate radius with displacement
                let radius = layer.baseRadius + displacement;

                // Scale to fit max diameter
                let scale = min(width, height) * 0.8 / (MAX_DIAMETER * 2);
                radius *= scale;

                let x = cos(angle) * radius;
                let y = sin(angle) * radius;

                vertex(x, y);
            }
            endShape(CLOSE);
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');
            const instructions = document.getElementById('instructions');
            const playBtn = document.getElementById('play-btn');
            const pauseBtn = document.getElementById('pause-btn');

            // Prevent default drag behaviors
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // Highlight drop zone when dragging over
            ['dragenter', 'dragover'].forEach(eventName => {
                document.body.addEventListener(eventName, () => {
                    dropZone.classList.add('active');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                document.body.addEventListener(eventName, () => {
                    dropZone.classList.remove('active');
                }, false);
            });

            // Handle dropped files
            document.body.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;

                if (files.length > 0) {
                    const file = files[0];
                    if (file.type.startsWith('audio/')) {
                        loadAudioFile(file);
                        instructions.classList.add('hidden');
                        playBtn.classList.add('active');
                        pauseBtn.classList.add('active');
                    }
                }
            }

            // Play/Pause controls
            playBtn.addEventListener('click', () => {
                if (song && audioLoaded) {
                    song.play();
                    isPlaying = true;
                }
            });

            pauseBtn.addEventListener('click', () => {
                if (song && audioLoaded) {
                    song.pause();
                    isPlaying = false;
                }
            });
        }

        function loadAudioFile(file) {
            // Stop and remove existing song if any
            if (song) {
                song.stop();
                song = null;
            }

            // Create object URL for the file
            const url = URL.createObjectURL(file);

            // Load the audio file
            song = loadSound(url, () => {
                audioLoaded = true;
                fft.setInput(song);
                amplitude.setInput(song);
                console.log('Audio loaded successfully');

                // Auto-play on load
                song.play();
                isPlaying = true;
            }, (err) => {
                console.error('Error loading audio:', err);
                audioLoaded = false;
            });
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
