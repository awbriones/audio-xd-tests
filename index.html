<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio XD Tests - Experiment Index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #888;
            margin-bottom: 3rem;
        }

        .experiments {
            display: grid;
            gap: 1.5rem;
        }

        .experiment-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .experiment-card:hover {
            border-color: #a855f7;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.15);
        }

        .experiment-card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #e0e0e0;
        }

        .experiment-card p {
            color: #999;
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            background: #2a2a2a;
            color: #a855f7;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.875rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Audio XD Tests</h1>
        <p class="subtitle">Experiments with sound and audio in experience design</p>

        <div class="experiments">
            <a href="experiments/visualizer/" class="experiment-card">
                <h2>Circular Audio Visualizer</h2>
                <p>Three-band frequency visualizer with wavy circular shapes. Drag and drop audio files to visualize bass, mid, and treble frequencies in real-time.</p>
                <span class="tag">FFT Analysis</span>
                <span class="tag">Canvas</span>
            </a>

            <!-- Future experiments will go here -->
        </div>
    </div>
</body>
</html>
